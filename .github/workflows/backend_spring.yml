# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: CI/CD - Build and Deploy Spring Boot to Azure Web App

on:
  push:
    branches:
      - backend
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - uses: actions/checkout@v4

      # 2️⃣ Setup Java 11
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '11'

      # 3️⃣ Verify Maven
      - name: Verify Maven
        run: mvn -v

      # 4️⃣ Build Spring Boot JAR
      - name: Build Spring Boot app
        working-directory: spring-backend
        run: mvn clean package -Dmaven.test.skip=true

      # 5️⃣ Upload JAR artifact
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: spring-backend-jar
          path: spring-backend/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write        # 🔥 REQUIRED for Azure OIDC
      contents: read

    steps:
      - name: Download JAR
        uses: actions/download-artifact@v4
        with:
          name: spring-backend-jar

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5D10C699DC16405D93799C1EFEEF315E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C53BB3DBB5DC4022934811CADA1AB1D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_455F9D1C802746038C854F9953D77354 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: spring
          slot-name: Production
          package: '*.jar'
